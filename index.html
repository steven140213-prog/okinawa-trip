function qPaint(){var a=Q[QV.k]||[];document.getElementById('qimg').src=a[QV.i]||'';document.getElementById('qh').innerHTML=esc(qName(QV.k))+'<small>點畫面任一處可關閉</small>';document.getElementById('qpos').textContent=a.length>1?(QV.i+1)+' / '+a.length:'';document.getElementById('qprev').style.display=document.getElementById('qnext').style.display=a.length>1?'':'none'}
function qStep(n){var a=Q[QV.k]||[];QV.i=(QV.i+n+a.length)%a.length;qPaint()}
function qHide(){document.getElementById('qrv').className=''}
function qBtn(k,l){var n=(Q[k]||[]).length;return n?'<button class="qb" onclick="qShow(\''+k+'\',0)"><i class="ti ti-qrcode" aria-hidden="true"></i>'+(l?esc(l)+' QR':'出示 QR')+(n>1?'（'+n+'）':'')+'</button>':'<button class="qb no" onclick="qShow(\''+k+'\',0)"><i class="ti ti-upload" aria-hidden="true"></i>'+(l?esc(l)+'：':'')+'尚未上傳 QR</button>'}
var FPURL='https://apps.apple.com/us/app/okinawa-funpass/id6444793002';
/* ===== 一般功能 ===== */
function prepLeft(){var n=0;P.forEach(function(g,a){g[1].forEach(function(_,b){if(!S.prep[a+'-'+b])n++})});return n}
function bookLeft(){var n=0;B.forEach(function(_,i){if(!S.book[i])n++});return n}
function tabs(){document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<button class="tab'+(S.tab==t[0]?' on':'')+'" onclick="go(\''+t[0]+'\')"><i class="ti '+t[1]+'" aria-hidden="true"></i>'+t[2]+'</button>'}).join('')}
function go(t){S.tab=t;if(t!='qr')S.qhl='';render()}
function setDay(k){S.day=k;render()}
function tog(k,j){var id=k+'-'+j;S.done[id]=!S.done[id];save();render()}
function tp(a,b){var id=a+'-'+b;S.prep[id]=!S.prep[id];save();render()}
function tb(i){S.book[i]=!S.book[i];save();render()}
function op(a){S.open[a]=!S.open[a];render()}
function addE(){var n=document.getElementById('en').value.trim(),v=parseFloat(document.getElementById('ev').value);if(!n||!(v>0)){S.err='輸入項目名稱與大於 0 的金額';render();return}S.err='';S.exp.push([n,Math.round(v)]);save();render()}
function delE(i){S.exp.splice(i,1);save();render()}
function setR(){var r=parseFloat(document.getElementById('rt').value);if(r>0){S.rate=r;save();render()}}
function cp(t,b){try{navigator.clipboard.writeText(t)}catch(e){}b.textContent='已複製';setTimeout(function(){b.textContent='複製'},1200)}
function telH(p){if(!/^[0-9-]+$/.test(p))return esc(p);return '<a href="tel:+81'+p.replace(/-/g,'').replace(/^0/,'')+'">'+p+'</a>'}
function ln(ic,t,c){return '<p class="in'+(c?' '+c:'')+'"><i class="ti '+ic+'" aria-hidden="true"></i><span>'+t+'</span></p>'}
function dayCard(k){var x=D[k],m=M[k],dt=x.d+'（週'+x.w+'）';
var h='<div class="dh"><div class="d1">DAY '+(k+1)+'・'+dt+'</div><h2>'+m.theme+'</h2><p class="sb">'+x.s+'</p>';
h+='<span class="pl"><i class="ti ti-map-pin" aria-hidden="true"></i>住宿市區：'+m.area+'</span> <span class="pl"><i class="ti ti-bed" aria-hidden="true"></i>'+x.st+'</span>';
h+=wxBlock(k);
h+='<ul class="rm">'+m.rem.map(function(r){return '<li><i class="ti ti-bulb" aria-hidden="true"></i><span>'+r+'</span></li>'}).join('')+'</ul>';
h+='<p class="tz">'+wxStamp()+'<br>'+(phoneOff()==540?'行程與營業時間皆為當地時間，和你手機顯示一致。':'行程與營業時間皆為「當地時間」（沖繩 GMT+9，比台灣快 1 小時）；人在沖繩時就會跟手機一致。')+'</p></div>';
return h}
function vTrip(){var x=D[S.day],k=S.day,n=0;x.i.forEach(function(_,j){if(S.done[k+'-'+j])n++});
var h='<div style="display:flex;gap:5px;margin-bottom:12px">'+D.map(function(d,i){var w=W[d.iso];return '<button class="chip'+(i==k?' on':'')+'" onclick="setDay('+i+')">Day'+(i+1)+'<b>'+d.d+'</b>週'+d.w+'<small>'+(w?w.e+' '+w.hi+'°':'—')+'</small></button>'}).join('')+'</div>';
h+=dayCard(k);
h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="font-size:12px;color:var(--text-secondary)">已走 '+n+' / '+x.i.length+' 站</span><div style="flex:1;height:5px;border-radius:3px;background:var(--surface-1)"><div style="height:5px;border-radius:3px;background:var(--text-success);width:'+Math.round(n/x.i.length*100)+'%"></div></div></div><p style="margin:0 0 4px;font-size:12px;color:var(--text-muted)">點圓圈標記「已到」。車程為估算，實際以 Google 地圖導航為準。</p>';
x.i.forEach(function(r,j){var on=S.done[k+'-'+j],y=TY[r[3]],f=r[4]||{};
if(j>0&&f.d)h+='<div class="dr"><i class="ti ti-car" aria-hidden="true"></i>'+esc(f.d)+'</div>';
h+='<div class="row"><div class="tm">'+r[0]+'</div><button class="dot'+(on?' on':'')+'" onclick="tog('+k+','+j+')" aria-label="標記已到"><i class="ti ti-check" aria-hidden="true"></i></button><div class="card'+(on?' dn':'')+'"><p class="ty" style="color:'+y[1]+'">'+y[0]+'</p><p class="tt">'+esc(r[1])+'</p>'+(r[2]?'<p class="nt">'+esc(r[2])+'</p>':'');
if(f.h)h+=ln('ti-clock',esc(f.h)+status(x,f.o));
if(f.t)h+=ln('ti-ticket',esc(f.t));
if(f.p)h+=ln('ti-phone',telH(f.p));
if(f.x)h+=ln('ti-info-circle',esc(f.x),'x');
h+='<div class="bt"><a class="nv" href="https://www.google.com/maps/dir/?api=1&destination='+q(f.pk||r[1])+'">導航</a><a href="https://www.google.com/maps/search/?api=1&query='+q(r[1])+'">地圖</a>'+(f.fp?'<a class="fp" href="'+FPURL+'"><i class="ti ti-ticket" aria-hidden="true"></i>開啟 FUN PASS App</a>':'')+(f.qr?(typeof f.qr=='string'?qBtn(f.qr):f.qr.map(function(k){return qBtn(k,k=='vjw'?'Visit Japan Web':k=='back'?'回程機票':'')}).join('')):'')+'</div></div></div>'});
return h}
function vPrep(){var h='<div style="background:var(--bg-warning);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px;font-size:13px;color:var(--text-warning)">還有 '+prepLeft()+' 項沒準備</div>';
P.forEach(function(g,a){var left=0;g[1].forEach(function(_,b){if(!S.prep[a+'-'+b])left++});
h+='<div class="box"><div class="bh" onclick="op('+a+')">'+g[0]+'<span>'+(left?'還有 '+left+' 項':'完成')+' <i class="ti '+(S.open[a]?'ti-minus':'ti-plus')+'" aria-hidden="true"></i></span></div>';
if(S.open[a])g[1].forEach(function(t,b){var on=S.prep[a+'-'+b];h+='<div class="ck'+(on?' on':'')+'" onclick="tp('+a+','+b+')"><i class="ti '+(on?'ti-checkbox':'ti-square')+'" aria-hidden="true"></i><span>'+t+'</span></div>'});
h+='</div>'});return h}
function vBook(){var h='<div style="background:var(--bg-warning);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px;font-size:13px;color:var(--text-warning)">還有 '+bookLeft()+' 項尚未訂位／訂購</div><div class="box">';
B.forEach(function(b,i){var on=S.book[i];h+='<div class="ck'+(on?' on':'')+'" style="'+(i?'':'border-top:none')+'" onclick="tb('+i+')"><i class="ti '+(on?'ti-circle-check':'ti-circle')+'" aria-hidden="true"></i><span><span style="font-size:12px;color:var(--text-secondary);display:block;text-decoration:none">'+b[0]+'</span>'+b[1]+'</span></div>'});
return h+'</div><p style="font-size:12px;color:var(--text-muted);margin:0">點項目切換已訂／未訂</p>'}
function vCost(){var t=0;S.exp.forEach(function(e){t+=e[1]});

h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><label style="font-size:13px;color:var(--text-secondary)">匯率 ¥1 =</label><input id="rt" type="number" step="0.001" value="'+S.rate+'" style="width:90px" onchange="setR()"><span style="font-size:13px;color:var(--text-secondary)">NT$</span></div>';
h+='<div style="display:flex;gap:8px"><input id="en" type="text" placeholder="午餐拉麵" style="flex:1;min-width:0"><input id="ev" type="number" placeholder="1200" style="width:84px"></div>';
h+='<div style="display:flex;align-items:center;gap:10px;margin:8px 0 6px"><button onclick="addE()">新增花費</button><span style="font-size:13px;color:var(--text-danger)">'+S.err+'</span></div>';
S.exp.forEach(function(e,i){h+='<div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-top:0.5px solid var(--border)"><span style="flex:1;font-size:14px">'+esc(e[0])+'</span><span style="font-size:14px;font-weight:500">¥'+e[1].toLocaleString()+'</span><button onclick="delE('+i+')" aria-label="刪除" style="padding:2px 6px"><i class="ti ti-x" aria-hidden="true"></i></button></div>'});
if(!S.exp.length)h+='<p style="font-size:13px;color:var(--text-muted);margin:8px 0 0">記下第一筆花費。</p>';
return h}
/* ===== 退稅清單：依發票（收據）記錄購買細項 ===== */
function addInv(){var s=document.getElementById('tsn').value.trim(),d=document.getElementById('tsd').value,no=document.getElementById('tsno').value.trim();if(!s||!d){S.terr='請輸入店名與購買日期';render();return}S.terr='';S.tax.push({shop:s,date:d,no:no,carry:false,items:[]});save();render()}
function delInv(i){if(!confirm('刪除這張發票和它的所有品項？'))return;S.tax.splice(i,1);save();render()}
function addIt(i){var n=document.getElementById('in'+i).value.trim(),p=parseFloat(document.getElementById('ip'+i).value),r=+document.getElementById('ir'+i).value,c=document.getElementById('ic'+i).value;if(!n||!(p>0))return;S.tax[i].items.push({n:n,p:Math.round(p),r:r,c:c});save();render()}

function carry(i){S.tax[i].carry=!S.tax[i].carry;save();render()}
function txOp(){S.txOpen=!S.txOpen;render()}
function invCalc(v){var g=0,net=0;v.items.forEach(function(it){g+=it.p;net+=it.p/(1+it.r/100)});return{g:g,net:net,tax:g-net}}
function vTax(){var grp={},tg=0,tn=0;
S.tax.forEach(function(v){var c=invCalc(v),key=v.shop.toLowerCase()+'|'+v.date;grp[key]=grp[key]||{net:0,tax:0,g:0};grp[key].net+=c.net;grp[key].tax+=c.tax;grp[key].g+=c.g});
var ok=0,okTax=0,okG=0,short=0;for(var k in grp){if(grp[k].net>=5000){ok++;okTax+=grp[k].tax;okG+=grp[k].g}else if(grp[k].g>0)short++}
var h='<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px"><div style="background:var(--surface-1);border-radius:var(--radius);padding:12px"><p style="margin:0;font-size:13px;color:var(--text-secondary)">可退稅購買額（含稅）</p><p style="margin:0;font-size:21px;font-weight:500">'+yen(okG)+'</p></div><div style="background:var(--bg-success);border-radius:var(--radius);padding:12px"><p style="margin:0;font-size:13px;color:var(--text-success)">預估退稅（未扣手續費）</p><p style="margin:0;font-size:21px;font-weight:500;color:var(--text-success)">'+yen(okTax)+'</p></div></div>';
if(short)h+='<div class="note" style="background:var(--bg-warning);color:var(--text-warning)">有 '+short+' 組「同店同日」未稅合計還沒滿 ¥5,000，目前不會算進預估退稅。</div>';
h+='<div class="box"><div class="bh" onclick="txOp()">11/1 起新制重點<span><i class="ti '+(S.txOpen?'ti-minus':'ti-plus')+'" aria-hidden="true"></i></span></div>';
if(S.txOpen)h+='<div style="padding:4px 14px 12px;font-size:13px;line-height:1.7;color:var(--text-secondary);border-top:0.5px solid var(--border)">• 先付含稅價，出境時由海關確認後退款（11/1 起購買的適用）<br>• <b>同一家店、同一天</b>未稅合計 ≥ ¥5,000 才能退<br>• 商品要<b>全部隨身帶</b>，並在<b>託運行李前</b>先辦理；託運後就不能辦<br>• 一張收據裡只要有一件沒帶出境，官方是以一次購買紀錄為單位確認，整張可能都不能退（這點是依官方規定推導）<br>• 食品、藥妝等消耗品在日本用掉或吃掉就不能退，要申告<br>• 購買日起 90 天內出境；辦理時要出示護照<br>• 那霸：2 樓出發大廳 Self Tax Refund 自助機（06:00–21:00，依航班可能變動），可領日圓現金；手續費未查到<br>• 退款方式依店家而異，購買時請店家確認<br>• 以上為 2026/10/24 查到的資料，請以官方為準：<a href="https://www.mlit.go.jp/kankocho/tax-free/page01_000001_00023.html">觀光廳 FAQ</a>、<a href="https://www.japan.travel/en/us/blog/everything-you-need-to-know-japans-new-tax-free-shopping-system/">JNTO 說明</a></div>';
h+='</div>';
S.tax.forEach(function(v,i){var c=invCalc(v),key=v.shop.toLowerCase()+'|'+v.date,gr=grp[key],good=gr.net>=5000;
h+='<div class="inv"><div class="ih"><div><b>'+esc(v.shop)+'</b><span>'+esc(v.date)+(v.no?'・單號 '+esc(v.no):'')+'</span></div><div style="text-align:right"><b>'+yen(c.g)+'</b><span>稅額約 '+yen(c.tax)+'</span></div></div>';
v.items.forEach(function(it,j){h+='<div class="it"><div class="n">'+esc(it.n)+'<small>'+(it.c=='x'?'消耗品（勿拆封）':'一般品')+'・稅率 '+it.r+'%・未稅 '+yen(it.p/(1+it.r/100))+'</small></div><div class="pc">'+yen(it.p)+'</div><button onclick="delIt('+i+','+j+')" aria-label="刪除品項"><i class="ti ti-x" aria-hidden="true"></i></button></div>'});
if(!v.items.length)h+='<div class="it" style="color:var(--text-muted);font-size:13px">還沒有品項，請在下面新增。</div>';
h+='<div class="fm"><input id="in'+i+'" placeholder="品項" style="flex:2 1 110px"><input id="ip'+i+'" type="number" inputmode="numeric" placeholder="含稅金額" style="flex:1 1 84px"><select id="ir'+i+'"><option value="10">10%</option><option value="8">8%</option></select><select id="ic'+i+'"><option value="n">一般品</option><option value="x">消耗品</option></select><button onclick="addIt('+i+')">加入</button></div>';
h+='<div class="sum"><span>同店同日未稅合計 '+yen(gr.net)+'</span><span class="tag '+(good?'ok':'no')+'">'+(good?'達 ¥5,000 門檻':'未達 ¥5,000')+'</span></div>';
h+='<div class="ck'+(v.carry?' on':'')+'" onclick="carry('+i+')"><i class="ti '+(v.carry?'ti-checkbox':'ti-square')+'" aria-hidden="true"></i><span>這張發票的商品已全部整理在隨身行李</span></div>';
h+='<div style="padding:6px 12px 10px;text-align:right"><button onclick="delInv('+i+')" style="font-size:12px;padding:3px 10px;color:var(--text-danger)">刪除這張發票</button></div></div>'});
if(!S.tax.length)h+='<p style="font-size:13px;color:var(--text-muted);margin:6px 0 10px">還沒有發票。每買一次就新增一張，再把細項一個一個記進去。</p>';
var td=new Date(),ds=td.getFullYear()+'-'+p2(td.getMonth()+1)+'-'+p2(td.getDate());if(ds<'2026-11-04'||ds>'2026-11-08')ds='2026-11-05';
h+='<div class="box" style="padding:10px 12px"><p style="margin:0 0 6px;font-weight:500;font-size:14px">新增發票</p><div style="display:flex;gap:6px;flex-wrap:wrap"><input id="tsn" placeholder="店名（例：唐吉訶德）" style="flex:1 1 140px"><input id="tsd" type="date" value="'+ds+'" style="flex:1 1 130px"><input id="tsno" placeholder="發票／收據號（選填）" style="flex:1 1 140px"><button onclick="addInv()">新增</button></div><p style="margin:6px 0 0;font-size:13px;color:var(--text-danger)">'+S.terr+'</p></div>';
return h}
function vQr(){var h='<div class="note"><i class="ti ti-lock" aria-hidden="true"></i> 圖片只存在這支手機的瀏覽器裡，不會上傳到網路。換手機、清除瀏覽資料或用無痕模式都會不見，所以重要的 QR 在手機相簿裡也請留一份。請上傳截圖或照片（PDF 請先截圖）；同一欄可放多張，例如多位旅客的機票。</div><div class="box">';
QS.forEach(function(s,i){var a=Q[s[0]]||[],t=a.length?'<img src="'+a[0]+'" alt="">':'<i class="ti ti-qrcode" aria-hidden="true"></i>';
h+='<div class="qs'+(S.qhl==s[0]?' hl':'')+'"><div class="th">'+t+'</div><div class="nm"><b>'+esc(s[1])+'</b><span>'+esc(s[2])+'・'+(a.length?'已存 '+a.length+' 張':'尚未上傳')+'</span></div><div class="ac">'+(a.length?'<button class="pr" onclick="qShow(\''+s[0]+'\',0)">出示</button>':'')+'<label>'+(a.length?'加圖':'上傳')+'<input type="file" accept="image/*" multiple class="sr-only" onchange="qAdd(\''+s[0]+'\',this.files)"></label>'+(a.length?'<button onclick="qDel(\''+s[0]+'\')">清除</button>':'')+'</div></div>'});

return h}
function vSos(){var L=[['110','警察，24 小時，免費','110'],['119','救護車與消防，24 小時，免費。說「きゅうきゅうしゃ」就是救護車','119'],['050-3816-2787','日本政府觀光局訪日旅客熱線，24 小時，有英語、中文、韓語','05038162787'],['+886-800-085-095','外交部旅外國人緊急服務專線（從國外撥）','+886800085095']];
var h='<div class="box" style="padding:4px 0">';
L.forEach(function(r,i){h+='<div style="display:flex;gap:10px;align-items:center;padding:10px 12px;'+(i?'border-top:0.5px solid var(--border)':'')+'"><div style="flex:1;min-width:0"><p style="margin:0;font-size:20px;font-weight:500">'+r[0]+'</p><p class="nt">'+r[1]+'</p></div><div style="display:flex;flex-direction:column;gap:6px"><button onclick="cp(\''+r[0]+'\',this)" style="font-size:12px;padding:4px 10px">複製</button><a href="tel:'+r[2]+'" style="font-size:12px;text-align:center;color:var(--text-accent);text-decoration:none">撥打</a></div></div>'});

return h}
function render(){tabs();var v=document.getElementById('view');v.innerHTML=({trip:vTrip,prep:vPrep,book:vBook,cost:vCost,tax:vTax,qr:vQr,sos:vSos})[S.tab]()}
