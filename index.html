<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>沖繩 5 天 4 夜</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
:root{--page:#faf9f5;--text-primary:#1f1e1d;--text-secondary:#5f5e5a;--text-muted:#888780;--text-accent:#185FA5;--text-warning:#854F0B;--text-success:#3B6D11;--text-danger:#A32D2D;--bg-accent:#E6F1FB;--bg-warning:#FAEEDA;--bg-success:#EAF3DE;--border:rgba(0,0,0,.12);--border-strong:rgba(0,0,0,.25);--border-stronger:rgba(0,0,0,.4);--surface-1:#f1efe8;--surface-2:#ffffff;--radius:8px}
@media (prefers-color-scheme:dark){:root{--page:#141413;--text-primary:#f1efe8;--text-secondary:#b4b2a9;--text-muted:#888780;--text-accent:#85B7EB;--text-warning:#FAC775;--text-success:#97C459;--text-danger:#F09595;--bg-accent:#0C447C;--bg-warning:#633806;--bg-success:#27500A;--border:rgba(255,255,255,.14);--border-strong:rgba(255,255,255,.28);--border-stronger:rgba(255,255,255,.45);--surface-1:#2c2c2a;--surface-2:#1f1e1d}}
body{margin:0;background:var(--page);color:var(--text-primary);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;line-height:1.6}
#app{max-width:480px;margin:0 auto;padding:12px}
h2{font-size:18px;font-weight:500}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
input,button{font:inherit;color:var(--text-primary);background:transparent;border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:6px 10px;box-sizing:border-box}
input{height:36px}
button{cursor:pointer}
button{font-family:inherit}
.tab{flex:1;min-width:0;padding:8px 0 6px;border:none;background:transparent;color:var(--text-secondary);font-size:12px;cursor:pointer;border-bottom:2px solid transparent;border-radius:0}
.tab i{display:block;font-size:20px;margin-bottom:2px}
.tab.on{color:var(--text-accent);border-bottom-color:var(--text-accent)}
.chip{flex:1;min-width:0;padding:7px 0;text-align:center;border:0.5px solid var(--border-strong);border-radius:var(--radius);cursor:pointer;background:transparent;font-size:12px;color:var(--text-secondary)}
.chip b{display:block;font-weight:500;font-size:15px;color:var(--text-primary)}
.chip.on{background:var(--bg-accent);border-color:var(--text-accent)}
.chip.on,.chip.on b{color:var(--text-accent)}
.row{display:flex;gap:8px;padding:8px 0}
.tm{width:42px;flex:none;font-size:13px;color:var(--text-secondary);padding-top:9px}
.dot{width:26px;height:26px;flex:none;border-radius:50%;border:1.5px solid var(--border-stronger);background:transparent;margin-top:7px;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:transparent;font-size:15px}
.dot.on{background:var(--bg-success);border-color:var(--text-success);color:var(--text-success)}
.card{flex:1;min-width:0;border:0.5px solid var(--border);border-radius:12px;padding:8px 12px;background:var(--surface-2)}
.card.dn{opacity:.55}
.ty{font-size:12px;margin:0}
.tt{font-size:15px;font-weight:500;line-height:1.4;margin:1px 0 0}
.nt{font-size:13px;color:var(--text-secondary);margin:2px 0 0;line-height:1.5}
.bt{display:flex;gap:6px;margin-top:6px}
.bt a{font-size:12px;padding:4px 10px;border:0.5px solid var(--border-strong);border-radius:var(--radius);color:var(--text-primary);text-decoration:none}
.bt a.nv{background:var(--bg-accent);color:var(--text-accent);border-color:var(--text-accent)}
.box{border:0.5px solid var(--border);border-radius:12px;background:var(--surface-2);margin-bottom:10px;overflow:hidden}
.bh{display:flex;justify-content:space-between;align-items:center;padding:12px;cursor:pointer;font-weight:500;font-size:15px}
.bh span{font-size:13px;font-weight:400;color:var(--text-warning)}
.ck{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-top:0.5px solid var(--border);font-size:14px;line-height:1.5;cursor:pointer}
.ck i{font-size:20px;color:var(--text-muted);margin-top:1px}
.ck.on i{color:var(--text-success)}
.ck.on span{color:var(--text-secondary);text-decoration:line-through}
</style>
</head>
<body>
<div id="app">
<div style="padding:.25rem 0 1rem">
<div style="background:var(--bg-accent);border-radius:12px;padding:14px 14px 12px;margin-bottom:10px">
<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:8px">
<div><p style="margin:0;font-size:12px;color:var(--text-accent)">2026/11/4 – 11/8</p><p style="margin:0;font-size:20px;font-weight:500;color:var(--text-accent)">沖繩 5 天 4 夜</p></div>
<div id="cd" style="font-size:22px;font-weight:500;color:var(--text-accent);text-align:right;white-space:nowrap"></div></div>
<p id="cdn" style="margin:6px 0 0;font-size:12px;color:var(--text-accent)">11/4（三）桃園機場出發</p>
</div>
<div style="display:flex;border-bottom:0.5px solid var(--border);margin-bottom:10px" id="tabs"></div>
<div id="view"></div>
</div>
</div>
<script>
var D=[
{d:'11/4',w:'三',t:'出發・飛抵那霸',st:'美居酒店',s:'樂桃 TPE→OKA 15:20–17:50',i:[
['09:30','7-11 壯五門市','出發','car'],['11:30','成祥 A10 車站停車場','','car'],['11:40','山鼻捷運站','','car'],['12:00','第一航廈（出境）','','go'],['15:20','樂桃航空 TPE→OKA','抵達 17:50','fly'],['19:00','那霸機場（入境）','單軌電車往てだこ浦西，壺川站下車','car'],['20:00','沖繩那霸美居酒店','Check in','stay'],['20:30','唐吉訶德 那霸壺川店','','go']]},
{d:'11/5',w:'四',t:'水族館・南部・國際通',st:'美居酒店',s:'12:00 租車，之後自駕',i:[
['08:30','出發','Uber','car'],['09:00','DMM Kariyushi 水族館','','go'],['12:00','OTS 臨空豐崎營業所','租車','car'],['12:40','系滿魚市場','午餐','eat'],['14:00','沖繩世界文化王國（玉泉洞）','','go'],['14:30','太鼓舞','園區內表演','go'],['—','大城天婦羅店 大城てんぷら店','時間夠再去','eat'],['16:30','瀨長島','停車：展望台附近','go'],['18:00','國際通','停車：アップルパーク 久茂地3丁目第1','go'],['19:00','燒肉王','晚餐','eat'],['22:00','回酒店','','stay']]},
{d:'11/6',w:'五',t:'中部逛街・換宿北谷',st:'Sunset Resort Mihama',s:'Check out → Check in 美濱',i:[
['08:00','出發','Check out','stay'],['08:30','達摩寺','','go'],['09:40','漫畫倉庫 浦添店','','go'],['10:50','PARCO CITY','','go'],['13:00','通堂 琉大北口店','午餐','eat'],['14:30','永旺夢樂城沖繩來客夢','','go'],['16:00','Sunset Resort Mihama サンセットリゾート美浜','Check in，附近晚餐','stay'],['20:00','Kanehide Sunset Market タウンプラザかねひで北谷サンセット市場','採買生便宜和牛、小菜、酒類等','eat']]},
{d:'11/7',w:'六',t:'北部海線一日遊',st:'Sunset Resort Mihama',s:'日落 17:44',i:[
['09:00','出發','','car'],['09:40','許田休息站','道の駅「許田」名護行きバス駐車場','car'],['10:30','古宇利海洋塔','停車：古宇利オーシャンタワー 第1駐車場','go'],['12:10','心形岩','','go'],['13:00','百年古家 大家','午餐','eat'],['15:00','The Sinmay','','go'],['16:20','琉球銘菓 三矢本舗 恩納店','','eat'],['16:40','萬座毛','日落 17:44','go'],['18:20','回民宿','','stay'],['19:00','美國村','晚餐','eat']]},
{d:'11/8',w:'日',t:'還車・返台',st:'返程',s:'樂桃 OKA→TPE 16:50–17:35',i:[
['09:30','出發','Check out','stay'],['10:00','漁師食堂 大ばんぶる舞 さかな大統漁','早午餐','eat'],['11:00','波上宮','宮內有停車場，可停 30 分鐘','go'],['12:00','OTS 臨空豐崎營業所','還車，搭 OTS 接駁車到機場','car'],['13:00','那霸機場（出境）','辦理退稅','go'],['16:50','樂桃航空 OKA→TPE','抵達 17:35','fly'],['17:00','第一航廈（入境）','','go'],['17:30','山鼻捷運站','取車','car'],['18:30','7-11 壯五門市','到家','go']]}];
var TY={fly:['航班','var(--text-accent)'],eat:['用餐','var(--text-warning)'],stay:['住宿','var(--text-success)'],car:['移動','var(--text-secondary)'],go:['景點','var(--text-primary)']};
var P=[
['出發前',['護照效期 6 個月以上','Visit Japan Web 填寫並截圖 QR','台灣駕照＋日文譯本（自駕必備）','確認租車預約（OTS）','eSIM／網卡','旅平險／不便險','換日幣、備信用卡','樂桃行李額度與劃位']],
['行李清單',['換洗衣物','雨具與防曬','常備藥品','充電器、行動電源（隨身）','手機架、車充','環保袋']],
['入境前（Day1）',['Visit Japan Web QR 準備好','護照、回程機票資訊','填好入境卡所需資料']],
['自駕提醒（Day2–5）',['護照、駕照、日文譯本帶在身上','確認 ETC 卡租借','先查好停車位（瀨長島、國際通）','日本靠左行駛','還車前加滿油']],
['退稅與離境（Day5）',['收據與護照放隨身包','11/1 起新制：先付含稅價，離境時在機場辦退稅（請以官方說明為準）','預留機場辦退稅時間']]];
var B=[['機票','樂桃 TPE→OKA 11/4、OKA→TPE 11/8'],['住宿','沖繩那霸美居酒店 11/4–11/6'],['住宿','Sunset Resort Mihama 11/6–11/8'],['租車','OTS 臨空豐崎營業所 11/5–11/8'],['門票','DMM Kariyushi 水族館'],['門票','沖繩世界文化王國（玉泉洞）'],['餐廳','燒肉王 11/5 19:00'],['門票','古宇利海洋塔（可選）']];
var S={day:0,tab:'trip',done:{},prep:{},book:{},exp:[],rate:0.21,open:{0:1},err:''};
try{var z=JSON.parse(localStorage.getItem('okTrip'));if(z){for(var k in z)S[k]=z[k]}}catch(e){}
function save(){try{localStorage.setItem('okTrip',JSON.stringify({done:S.done,prep:S.prep,book:S.book,exp:S.exp,rate:S.rate}))}catch(e){}}
var TABS=[['trip','ti-flag','行程'],['prep','ti-clipboard-list','準備'],['book','ti-checkbox','訂位'],['cost','ti-currency-yen','花費'],['sos','ti-alert-triangle','急用']];
function q(s){return encodeURIComponent(s+' 沖繩')}
function cd(){var ms=new Date('2026-11-04T09:30:00+08:00')-new Date();var el=document.getElementById('cd');if(ms<=0){el.textContent='旅程進行中';return}var m=Math.floor(ms/60000);el.innerHTML=Math.floor(m/1440)+'<small style="font-size:12px;font-weight:400"> 天 </small>'+Math.floor(m%1440/60)+'<small style="font-size:12px;font-weight:400"> 時 </small>'+(m%60)+'<small style="font-size:12px;font-weight:400"> 分</small>'}
function prepLeft(){var n=0;P.forEach(function(g,a){g[1].forEach(function(_,b){if(!S.prep[a+'-'+b])n++})});return n}
function bookLeft(){var n=0;B.forEach(function(_,i){if(!S.book[i])n++});return n}
function tabs(){document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<button class="tab'+(S.tab==t[0]?' on':'')+'" onclick="go(\''+t[0]+'\')"><i class="ti '+t[1]+'" aria-hidden="true"></i>'+t[2]+'</button>'}).join('')}
function go(t){S.tab=t;render()}
function setDay(k){S.day=k;render()}
function tog(k,j){var id=k+'-'+j;S.done[id]=!S.done[id];save();render()}
function tp(a,b){var id=a+'-'+b;S.prep[id]=!S.prep[id];save();render()}
function tb(i){S.book[i]=!S.book[i];save();render()}
function op(a){S.open[a]=!S.open[a];render()}
function addE(){var n=document.getElementById('en').value.trim(),v=parseFloat(document.getElementById('ev').value);if(!n||!(v>0)){S.err='輸入項目名稱與大於 0 的金額';render();return}S.err='';S.exp.push([n,Math.round(v)]);save();render()}
function delE(i){S.exp.splice(i,1);save();render()}
function setR(){var r=parseFloat(document.getElementById('rt').value);if(r>0){S.rate=r;save();render()}}
function cp(t,b){try{navigator.clipboard.writeText(t)}catch(e){}b.textContent='已複製';setTimeout(function(){b.textContent='複製'},1200)}
function vTrip(){var x=D[S.day],k=S.day,n=0;x.i.forEach(function(_,j){if(S.done[k+'-'+j])n++});
var h='<div style="display:flex;gap:5px;margin-bottom:12px">'+D.map(function(d,i){return '<button class="chip'+(i==k?' on':'')+'" onclick="setDay('+i+')">Day'+(i+1)+'<b>'+d.d+'</b>週'+d.w+'</button>'}).join('')+'</div>';
h+='<p style="margin:0;font-size:12px;color:var(--text-secondary)">Day '+(k+1)+'・'+x.d+'（週'+x.w+'）・住宿 '+x.st+'</p><h2 style="margin:2px 0 2px">'+x.t+'</h2><p style="margin:0 0 6px;font-size:13px;color:var(--text-secondary)">'+x.s+'</p>';
h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="font-size:12px;color:var(--text-secondary)">已走 '+n+' / '+x.i.length+' 站</span><div style="flex:1;height:5px;border-radius:3px;background:var(--surface-1)"><div style="height:5px;border-radius:3px;background:var(--text-success);width:'+Math.round(n/x.i.length*100)+'%"></div></div></div><p style="margin:0 0 4px;font-size:12px;color:var(--text-muted)">點圓圈標記「已到」</p>';
x.i.forEach(function(r,j){var on=S.done[k+'-'+j],y=TY[r[3]];
h+='<div class="row"><div class="tm">'+r[0]+'</div><button class="dot'+(on?' on':'')+'" onclick="tog('+k+','+j+')" aria-label="標記已到"><i class="ti ti-check" aria-hidden="true"></i></button><div class="card'+(on?' dn':'')+'"><p class="ty" style="color:'+y[1]+'">'+y[0]+'</p><p class="tt">'+r[1]+'</p>'+(r[2]?'<p class="nt">'+r[2]+'</p>':'')+'<div class="bt"><a class="nv" href="https://www.google.com/maps/dir/?api=1&destination='+q(r[1])+'">導航</a><a href="https://www.google.com/maps/search/?api=1&query='+q(r[1])+'">地圖</a></div></div></div>'});
return h}
function vPrep(){var h='<div style="background:var(--bg-warning);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px;font-size:13px;color:var(--text-warning)">還有 '+prepLeft()+' 項沒準備</div>';
P.forEach(function(g,a){var left=0;g[1].forEach(function(_,b){if(!S.prep[a+'-'+b])left++});
h+='<div class="box"><div class="bh" onclick="op('+a+')">'+g[0]+'<span>'+(left?'還有 '+left+' 項':'完成')+' <i class="ti '+(S.open[a]?'ti-minus':'ti-plus')+'" aria-hidden="true"></i></span></div>';
if(S.open[a])g[1].forEach(function(t,b){var on=S.prep[a+'-'+b];h+='<div class="ck'+(on?' on':'')+'" onclick="tp('+a+','+b+')"><i class="ti '+(on?'ti-checkbox':'ti-square')+'" aria-hidden="true"></i><span>'+t+'</span></div>'});
h+='</div>'});return h}
function vBook(){var h='<div style="background:var(--bg-warning);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px;font-size:13px;color:var(--text-warning)">還有 '+bookLeft()+' 項尚未訂位／訂購</div><div class="box">';
B.forEach(function(b,i){var on=S.book[i];h+='<div class="ck'+(on?' on':'')+'" style="'+(i?'':'border-top:none')+'" onclick="tb('+i+')"><i class="ti '+(on?'ti-circle-check':'ti-circle')+'" aria-hidden="true"></i><span><span style="font-size:12px;color:var(--text-secondary);display:block;text-decoration:none">'+b[0]+'</span>'+b[1]+'</span></div>'});
return h+'</div><p style="font-size:12px;color:var(--text-muted);margin:0">點項目切換已訂／未訂</p>'}
function vCost(){var t=0;S.exp.forEach(function(e){t+=e[1]});
var h='<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px"><div style="background:var(--surface-1);border-radius:var(--radius);padding:12px"><p style="margin:0;font-size:13px;color:var(--text-secondary)">總花費</p><p style="margin:0;font-size:22px;font-weight:500">¥'+t.toLocaleString()+'</p></div><div style="background:var(--surface-1);border-radius:var(--radius);padding:12px"><p style="margin:0;font-size:13px;color:var(--text-secondary)">約合台幣</p><p style="margin:0;font-size:22px;font-weight:500">NT$'+Math.round(t*S.rate).toLocaleString()+'</p></div></div>';
h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><label style="font-size:13px;color:var(--text-secondary)">匯率 ¥1 =</label><input id="rt" type="number" step="0.001" value="'+S.rate+'" style="width:90px" onchange="setR()"><span style="font-size:13px;color:var(--text-secondary)">NT$</span></div>';
h+='<div style="display:flex;gap:8px"><input id="en" type="text" placeholder="午餐拉麵" style="flex:1;min-width:0"><input id="ev" type="number" placeholder="1200" style="width:84px"></div>';
h+='<div style="display:flex;align-items:center;gap:10px;margin:8px 0 6px"><button onclick="addE()">新增花費</button><span style="font-size:13px;color:var(--text-danger)">'+S.err+'</span></div>';
S.exp.forEach(function(e,i){h+='<div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-top:0.5px solid var(--border)"><span style="flex:1;font-size:14px">'+e[0].replace(/</g,'&lt;')+'</span><span style="font-size:14px;font-weight:500">¥'+e[1].toLocaleString()+'</span><button onclick="delE('+i+')" aria-label="刪除" style="padding:2px 6px"><i class="ti ti-x" aria-hidden="true"></i></button></div>'});
if(!S.exp.length)h+='<p style="font-size:13px;color:var(--text-muted);margin:8px 0 0">記下第一筆花費。</p>';
return h}
function vSos(){var L=[['110','警察，24 小時，免費','110'],['119','救護車與消防，24 小時，免費。說「きゅうきゅうしゃ」就是救護車','119'],['050-3816-2787','日本政府觀光局訪日旅客熱線，24 小時，有英語、中文、韓語','05038162787'],['+886-800-085-095','外交部旅外國人緊急服務專線（從國外撥）','+886800085095']];
var h='<div class="box" style="padding:4px 0">';
L.forEach(function(r,i){h+='<div style="display:flex;gap:10px;align-items:center;padding:10px 12px;'+(i?'border-top:0.5px solid var(--border)':'')+'"><div style="flex:1;min-width:0"><p style="margin:0;font-size:20px;font-weight:500">'+r[0]+'</p><p class="nt">'+r[1]+'</p></div><div style="display:flex;flex-direction:column;gap:6px"><button onclick="cp(\''+r[0]+'\',this)" style="font-size:12px;padding:4px 10px">複製</button><a href="tel:'+r[2]+'" style="font-size:12px;text-align:center;color:var(--text-accent);text-decoration:none">撥打</a></div></div>'});
h+='</div><div style="background:var(--surface-1);border-radius:var(--radius);padding:10px 12px;font-size:13px;color:var(--text-secondary);line-height:1.6">駐那霸辦事處的電話與上班時間，出發前請到外交部領事事務局官網確認後再記下來。租車公司、飯店電話可以另外存在手機通訊錄。</div>';
return h}
function render(){tabs();var v=document.getElementById('view');v.innerHTML=({trip:vTrip,prep:vPrep,book:vBook,cost:vCost,sos:vSos})[S.tab]()}
cd();setInterval(cd,30000);render();
</script>
</body>
</html>
